# GitHub Actions 云端编译：把本仓库推到 GitHub 后，自动编译出 APK 供下载。
# 免费额度足够个人使用，本地无需安装任何 Android 开发环境。
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:   # 也支持在 GitHub 网页上手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: wmc-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
